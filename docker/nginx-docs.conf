server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # VitePress is built with cleanUrls: true → serve extensionless paths
    # by falling back to the matching .html file.
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    error_page 404 /404.html;

    # Long cache for hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
